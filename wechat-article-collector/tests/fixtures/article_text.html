    <p>猫咪每天舔毛会吞入大量毛发，生理性呕吐虽常见，长期依赖并不健康。</p>
    <p><img data-src="https://mmbiz.qpic.cn/mmbiz_png/img001/640?wx_fmt=png" src="data:image/gif;base64,UklGRhIAAABXRUJQVlA4WAoAAAAQAAAAAQA="></p>
    <p>膳食纤维分为可溶与不可溶两类：可溶性纤维（如<strong>甜菜粕</strong>）持水形成凝胶，不可溶性纤维（如纤维素）增加粪便体积。</p>
    <p><img data-src="//mmbiz.qpic.cn/mmbiz_jpg/img002/640?wx_fmt=jpeg"></p>
    <p>建议逐步提升至配方 5%–8% 的粗纤维区间，并保证充足饮水。</p>
