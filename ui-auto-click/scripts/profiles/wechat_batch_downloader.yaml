# 「微信公众号文章批量下载工具」（长风998）自动点击流程
#
# 来源：视频教程《公众号文章批量下载工具，一键导出所有历史文章，免费好用！》逐帧复刻
#       （2.4 版界面）+ 本机 4.0 版真机 UIA 控件树校准（走查见 references）。
# 控件映射证据见 references/wechat-batch-downloader-flow.md §4.0 真机映射表。
#
# 版本兜底写法：target 写成列表，按顺序尝试。
#   4.0（PySide6 + qfluentwidgets）控件带稳定 auto_id（Form.PushButton 等）；
#   2.4（旧版）auto_id 不一定有，退回按控件显示名命中。
#
# 真机已确认的两个反直觉点（改之前先读）：
#   1) 日志区是 Form.TextEdit（大文本框，Name 就是日志正文）；
#      Form.PlainTextEdit 是顶部的「微信文章链接」输入框 —— 别搞反。
#   2) 「1.获取公众号id」要求先在 PC 微信内置浏览器打开该公众号页面，
#      否则日志只会刷「请先在左面打开微信内置浏览器」。
#
# 注意：run 会真实操作软件（会真的开始批量下载），务必先 --dry-run，再 --max-steps 分段。

window:
  regex: '.*公众号.*下载工具.*'
  classes: [Mywindow]     # 类名才是稳定标识：UIA 侧标题会在中文标题与 wechatdownload 之间跳变

steps:
  # ---------------- 第一段：确定性设置（2026-10-23 用户口径） ----------------
  # **采集口径只保留这 4 项**（用户 2026-10-23 截图指定）：
  #   导出MD文件 ✓ / 下载图片音频视频 ✓ / 选择时间=按 RANGE 参数（默认全部）✓ / 等待时间=10
  # 另加两个数值：下载超过阅读量的文章=0、开始下载页数=-1（=全部）。
  # 其余开关一律**显式关掉**，不吃工具默认值也不吃上次运行的残留 —— 实测残留：
  # 「下载评论」「下载评论回复」默认是开的（probe 读出 state=1），会把评论区
  # 一起抓进来，下游 clean 还得再洗一遍。
  - name: 读日志区现状（基线）
    action: read
    target:
      - {auto_id: Form.TextEdit}
      - {control_type: Edit, name_regex: '.*'}
    save_as: log_before

  - name: 勾选导出MD文件
    action: toggle
    state: true
    target:
      - {auto_id: Form.CheckBox, name: 导出MD文件}
      - {control_type: CheckBox, name: 导出MD文件}

  - name: 勾选下载图片/音频/视频
    action: toggle
    state: true
    target:
      - {auto_id: Form.CheckBox_13, name: 下载图片/音频/视频}
      - {control_type: CheckBox, name: 下载图片/音频/视频}

  - name: 取消导出PDF
    action: toggle
    state: false
    target:
      - {auto_id: Form.CheckBox_2, name: 导出PDF}
      - {control_type: CheckBox, name: 导出PDF}

  - name: 取消导出WORD
    action: toggle
    state: false
    target:
      - {auto_id: Form.CheckBox_3, name: 导出WORD}
      - {control_type: CheckBox, name: 导出WORD}

  - name: 取消导出MHTML文件
    action: toggle
    state: false
    target:
      - {auto_id: Form.CheckBox_10, name: 导出MHTML文件}
      - {control_type: CheckBox, name: 导出MHTML文件}

  - name: 取消下载评论
    action: toggle
    state: false
    target:
      - {auto_id: Form.CheckBox_6, name: 下载评论}
      - {control_type: CheckBox, name: 下载评论}

  - name: 取消下载评论回复
    action: toggle
    state: false
    target:
      - {auto_id: Form.CheckBox_7, name: 下载评论回复}
      - {control_type: CheckBox, name: 下载评论回复}

  - name: 取消文件开头添加日期
    action: toggle
    state: false
    target:
      - {auto_id: Form.CheckBox_5, name: 文件开头添加日期}
      - {control_type: CheckBox, name: 文件开头添加日期}

  - name: 取消自动监听剪切板
    action: toggle
    state: false
    target:
      - {auto_id: Form.CheckBox_8, name: 自动监听剪切板}
      - {control_type: CheckBox, name: 自动监听剪切板}

  - name: 取消只下载原创
    action: toggle
    state: false
    target:
      - {auto_id: Form.CheckBox_11, name: 只下载原创}
      - {control_type: CheckBox, name: 只下载原创}

  # 本机 4.0 实测：这一项恒为禁用（灰），且与「导出MHTML文件」无关
  #（关掉 MHTML 后依然禁用，已做可逆对照验证）。故标 optional，改成告警不中断。
  - name: 勾选导出HTML文件
    action: toggle
    state: true
    optional: true
    target:
      - {auto_id: Form.CheckBox_4, name: 导出HTML文件}
      - {control_type: CheckBox, name: 导出HTML文件}

  - name: 设置等待时间（秒）
    action: set_value
    value: "10"
    target:
      - {auto_id: Form.LineEdit_2, control_type: Edit}
      - {control_type: Edit, name: "10"}

  - name: 设置下载超过阅读量的文章阈值
    action: set_value
    value: "0"
    target:
      - {auto_id: Form.LineEdit_3, control_type: Edit}
      - {control_type: Edit, name: "0"}

  - name: 设置开始下载页数（-1 = 全部）
    action: set_value
    value: "-1"
    target:
      - {auto_id: Form.LineEdit_5, control_type: Edit}
      - {control_type: Edit, name: "-1"}

  - name: 填入微信文章链接（变量 ARTICLE_URL）
    action: set_value
    value: "${ARTICLE_URL}"
    skip_if_empty: true
    target:
      - {auto_id: Form.PlainTextEdit, control_type: Edit}
      - {control_type: Edit, name: ""}

  # 时间范围由 `--var RANGE=all|monthly` 决定（默认 all＝全部历史），见文末两条互斥步骤。
  # 默认值的**唯一定义处**是 pipeline.py / favorites_chain.py 的 `--range` argparse default；
  # 下面 when_default 只在"手工 clicker.py run 且没传 --var RANGE="时兜底 ——
  # 改这里不等于改默认值，别在这里调口径。
  # 单选按钮对 UIA Invoke 同样假成功，必须真实鼠标点击。
  # 这两步放最后：切换时间范围可能重排下面的日期框，先点会把后续控件坐标搞乱。
  #
  # 为什么默认改成「全部」：这个 profile 的用途是"把一个号的历史取全"，而「一个月内」
  # 是当初为别的口径（只追新）定的。批量采集时它会把更早的篇目静默漏掉、且看不出来
  # —— 产物照样是"成功"，只是少了一大半，比报错更难发现。
  #
  # **下面这条 activate 不是冗余，删了会静默点错窗口**（2026-10-26 实测代价）：
  # 真实鼠标点击落到「屏幕上该坐标最上层的窗口」，与焦点无关。全表三次真实点击里，
  # 「获取公众号id」「批量下载文章」前面都各配了一条 activate，唯独时间范围这两步没有
  # —— 它俩是全表唯一"在工具可能不在最前时发生的鼠标点击"。工具被别的窗口盖住时，
  # 实测点了「全部」、回读仍是「一年内」=1，而当日日志报的是 ok：既没生效也没报错。
  # （z 序当时的快照没留证，所以不追责归因；但补 activate 是确定要做的。）
  - name: 激活窗口（设置时间范围前，防止点击落到遮挡窗口）
    action: activate

  - name: 设置时间范围（全部历史）
    action: click
    # verify_selected：点前后都用 SelectionItem 回读选中态。①已选中就不发鼠标（那就
    # 不可能发生"点错范围"）；②没选中才点，点完回读不是它就抛错并报出 点前/点后
    # 选中项名称 —— 没有这一步，"点了但没生效"在日志上和普通成功长得一模一样。
    verify_selected: true
    when_var: RANGE
    when_in: ["all", "全部"]
    when_default: true          # 不传 RANGE 时默认走这条（取回完整历史）
    target:
      - {auto_id: Form.layoutWidget.RadioButton_5, name: 全部}
      - {control_type: RadioButton, name: 全部}

  - name: 设置时间范围（一个月内）
    action: click
    verify_selected: true       # 同上：回读证明"点真的生效了"，见上面那条注释
    when_var: RANGE
    when_in: ["monthly", "一个月内"]
    target:
      - {auto_id: Form.layoutWidget.RadioButton_2, name: 一个月内}
      - {control_type: RadioButton, name: 一个月内}

  # ---------------- 第 1.5 段：自定义时间范围（逐月回溯用） ----------------
  # 为什么必须支持自定义（2026-11-01 用户口径）：
  #   批量回溯历史要求"每次只取某一个月、且月窗要能往回推"。工具自带的
  #   「一个月内」是**相对今天**的滚动窗，推不回去；「全部」一次抓完又不符合
  #   "逐月推进、当月抓满才推下一个月"的节奏。只有「自定义」能精确指定起止日。
  #
  # 日期值是 yyyy-MM-dd（调用方 → 本 profile），由 set_date 收敛成控件要求的
  # yyyy/MM/dd。**不要改成 set_value**：日期框是 QDateEdit，ValuePattern.SetValue
  # 假成功、逐字符输入被吞（2026-11-01 真机三条写法全部无变化），只有
  # 「点进控件 → Ctrl+A → Ctrl+V」这条路走得通。详见 clicker.set_date 注释。
  - name: 设置时间范围（自定义，起止日期见下两步）
    action: click
    verify_selected: true       # 单选按钮 Invoke 假成功，必须真实鼠标点击 + 回读
    when_var: RANGE
    when_in: ["custom", "自定义"]
    target:
      - {auto_id: Form.layoutWidget.RadioButton_4, name: 自定义}
      - {control_type: RadioButton, name: 自定义}

  # 起止日期都**含当天**（窗口是闭区间）。调度器按「上月同日 → 今天」切窗，
  # 相邻两窗在边界那天各取一次；宁可重一篇（下载工具按文章去重，重了不新增
  # 文件），也不要漏一篇 —— 漏是静默的，重是可见的。
  - name: 设置自定义起始日期 ${DATE_START}
    action: set_date
    value: "${DATE_START}"
    when_var: RANGE
    when_in: ["custom", "自定义"]
    click_ratio: 0.35           # 右侧 65% 处是日历下拉箭头，点中会弹面板
    target:
      - {auto_id: Form.layoutWidget.dateEdit}
      - {control_type: Spinner, index: 0}

  - name: 设置自定义结束日期 ${DATE_END}
    action: set_date
    value: "${DATE_END}"
    when_var: RANGE
    when_in: ["custom", "自定义"]
    click_ratio: 0.35
    target:
      - {auto_id: Form.layoutWidget.dateEdit_2}
      # 两个 Spinner 同名同型，兜底只能靠 UIA 树序（dateEdit 在前）
      - {control_type: Spinner, index: 1}

  # ---------------- 第二段：真操作（点两个按钮） ----------------
  # 重要：qfluentwidgets 的按钮对 UIA Invoke **假成功**——invoke() 不报错但什么也不发生。
  # 实测（2026-10-22 真机）：最小化 / 恢复 / 置前后 Invoke 均无效，改真实鼠标点击后
  # 立刻输出「获取公众号历史消息页面成功…」。所以按钮一律 click，且 click 前先 activate。
  # ---------------- 第 2.4 段：预热（时序要求，别删） ----------------
  # 工具的「自动获取密钥」只在点完「1.获取公众号id」之后的短窗口内读**一次**微信
  # 当前页面。所以"目标页必须是一次新鲜导航"这件事要发生在**点 id 之后**，而
  # "离开目标页"必须发生在**点 id 之前**。三次真机观测（2026-10-23）：
  #   点 id 时在别页 → 之后导航到目标页 → 成功
  #   点 id 时已在目标页 → 没有导航 → 反复刷「请先在微信打开复制的链接」
  #   点 id 已在目标页、之后才 warmup → 刷一次「开始获取密钥」后死等（读到的是首页）
  # 因此预热放在这里（点 id 之前），并且**必须**排在下面的 activate 之前：
  # 预热会把微信窗口提到最前，紧接着的 activate 再把工具窗口抢回来，真实点击才不会
  # 落到微信身上。
  - name: 预热微信页面（用该号文章页，点取 id 前先离开目标页）
    action: open_url
    source: value
    # 预热目标用**该号的文章页**（同一个 ${ARTICLE_URL}），不要用 mp.weixin.qq.com
    # 首页 —— 那是「微信公众平台」登录页，扫码页对流程毫无用处，还会把用户带到
    # 一个不该去的界面（2026-10-23 用户明确要求不要打开它）。
    # 用文章页反而更合工具设计：教程原话就是「先在微信打开该号文章」。
    value: "${ARTICLE_URL}"
    skip_if_empty: true
    settle: 3
    target:
      - {auto_id: Form.TextEdit}

  - name: 激活窗口（真实鼠标点击前必须做）
    action: activate

  - name: 点「1.获取公众号id」（真实鼠标）
    action: click
    target:
      - {auto_id: Form.PushButton, name: "1.获取公众号id"}
      - {control_type: Button, name: "1.获取公众号id"}

  - name: 等日志给出 profile_ext 链接 / 需先在微信打开 / 失败
    action: wait_log
    source: file
    path: 'C:/Users/Administrator/Desktop/下载/log*.txt'
    timeout: 60
    interval: 1.0
    contains_any:
      - 获取公众号历史消息页面成功
      - 开始获取密钥
      - 请先在左面打开微信内置浏览器
      - 获取失败
      # 2026-10-23 取证更正：这一句**不是**启动横幅，而是点完「1.获取公众号id」
      # 之后**请求失败时**才追加的一行建议（启动时静态横幅只有教程/官网/更新 3 行，
      # 实测 214 字符；点了失败后变成 308 字符）。它只是 hint、不是终态，所以这里
      # 只用来"早点醒过来"，真正的成败交给下面的正向判据。
      - 可以把梯子关了试一试
    target:
      - {auto_id: Form.TextEdit}

  # 只有「微信内置浏览器没开」是明确需要人工介入的死结（工具压根读不到公众号），
  # 立刻中断并把处置写进报错。
  # 曾经用 not_contains 去黑「可以把梯子关了试一试」「获取失败」，结果把工具自己
  # 打的启动建议当成错误，导致每次运行都在这一步误中断（2026-10-23 真机抓到的假阳性）。
  # 黑名单判定天然脆弱：日志里出现该字样就中毒，与"当前是否真失败"无关。
  - name: 微信内置浏览器没打开就立刻中断（需人工先打开该号文章）
    action: assert_log
    source: file
    path: 'C:/Users/Administrator/Desktop/下载/log*.txt'
    not_contains:
      - 请先在左面打开微信内置浏览器
    target:
      - {auto_id: Form.TextEdit}

  # 正向判据（2026-10-29 chain_run7 实机纠错）：点完「1.获取公众号id」之后，4.0 版工具
  # 的真实成功标记是「获取密钥成功！请点击下载按钮」，**不是**「获取公众号历史消息页面成功」——
  # 后者是**点完「2.批量下载文章」之后**才出现的（见下方第 16 步）。两者在 4.0 被拆成两个
  # 按钮，旧注释把"历史页成功"当成了"取 id 成功"的判据，导致这一步永远等不到、超时 rc=3。
  # 取密钥在微信内置浏览器已打开该号文章时通常 1 分钟内完成，但工具会自动重试循环
  # （实测曾连刷 19 分钟才成功），故 timeout 给足 300s。
  - name: 等「获取密钥成功」（取 id 成功判据，4.0 真实标记）
    action: wait_log
    source: file
    path: 'C:/Users/Administrator/Desktop/下载/log*.txt'
    timeout: 300
    interval: 2.0
    contains_any:
      - 获取密钥成功
    target:
      - {auto_id: Form.TextEdit}

  # ---------------- 第 2.5 段：取密钥（用户 2026-10-23 指定三步，已封进 open_url） ----------------
  # 工具只把 profile_ext 链接放进剪贴板并提示「请在微信打开复制的链接」；它需要
  # 微信内置浏览器的 cookie 才能「获取密钥成功」。open_url 就是那三步：
  #   ① 取链接（日志正文优先，剪贴板兜底）
  #   ② 点微信标题栏右侧放大镜（模板 templates/wechat-search.png，实测距右边缘 220px）
  #   ③ 在弹出的「在搜一搜中搜索，或输入网址」框里 Ctrl+V 粘贴并回车
  - name: 在微信内置浏览器打开 profile_ext 链接（取密钥）
    action: open_url
    source: log
    settle: 5
    # 不要在这里加 warmup！点火时刻已经在上面的「预热」步骤完成。放在这里会把页面
    # 先导到首页——而工具此时正在读，读到首页就直接判失败并死等（实测 14:41）。
    optional: false
    target:
      - {auto_id: Form.TextEdit}

  # 打开后工具下次重试就会成功。若 90 秒还没成功，说明链接给错了（多半是给了
  # 文章链接而不是 profile_ext）或微信搜索框没吃下粘贴内容。
  - name: 等「获取密钥成功」
    action: wait_log
    source: file
    path: 'C:/Users/Administrator/Desktop/下载/log*.txt'
    timeout: 90
    interval: 2.0
    contains_any:
      - 获取密钥成功
    target:
      - {auto_id: Form.TextEdit}

  - name: 等主按钮文字变回「2.批量下载文章」（运行时会显示"暂停中..."）
    action: wait_control
    timeout: 180
    interval: 2.0
    expect_name_regex: '批量下载|立即下载|开始下载'
    require_enabled: true
    target:
      - {auto_id: Form.PrimaryPushButton}

  - name: 激活窗口
    action: activate

  - name: 点「2.批量下载文章」（真实鼠标）
    action: click
    target:
      - {auto_id: Form.PrimaryPushButton}
      - {control_type: Button, name_regex: '批量下载|立即下载'}

  - name: 等日志出现「获取公众号历史消息页面成功」/「起始下载页数」或「下载完成」（工具真实输出是 起始下载页数：N，非 开始下载）
    action: wait_log
    source: file
    path: 'C:/Users/Administrator/Desktop/下载/log*.txt'
    timeout: 300
    interval: 2.0
    contains_any:
      - 获取公众号历史消息页面成功
      - 起始下载页数
      - 下载完成
    target:
      - {auto_id: Form.TextEdit}

  # 判"下载结束"不能只看日志静止 15 秒：工具会「暂停19秒，防止访问被限制」，
  # 那个静止窗口会被误判成结束。这里要求 60 秒零增长。
  - name: 等日志 60 秒零增长（判任务结束）
    action: wait_stable
    source: file
    path: 'C:/Users/Administrator/Desktop/下载/log*.txt'
    stable_seconds: 60
    interval: 5
    timeout: 1800
    target:
      - {auto_id: Form.TextEdit}

  # 「等导出文件落盘」这一步已删除（2026-10-23）：它把绝对路径写死在 profile 里，
  # 而实际产物落在 <保存目录>/<号名>/ 子目录下，本机永远只有 0/2 命中，白白把一个
  # 成功的下载判成退出码 5（部分成功），让编排层把成功当失败。
  # 产物判定交给编排层：pipeline.stage_download 按 `--account` 目录数 md（新增数 +
  # 空壳比例），比在步骤表里猜路径可靠。

  - name: 截图留证（PrintWindow，遮挡无关）
    action: screenshot
    path: out/auto-click-evidence.png
