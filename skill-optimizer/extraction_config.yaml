# ============================================================================
# Skill 优化大师（skill-optimizer）—— 配置文件
# ----------------------------------------------------------------------------
# 本文件承载「可调参数」：评估维度权重、每轮必查项、门禁阈值、术语表。
# 默认值即「通用推荐值」，开箱可直接用；只有当你确认某个默认值不适合当前
# 技能的形态时才覆盖它，并在注释里写明原因（便于下一次复用时有据可查）。
#
# ⚠️ 写法约定（来自真实事故 AP-01）：字符串取值一律加引号。
#    例如 mode: 'off' 而不是 mode: off —— YAML 1.1 会把裸写的 off/on/yes/no
#    解析成布尔值，导致「设为 off」变成 False，行为与预期相反。
# ============================================================================

meta:
  config_version: '1.0.1'
  for_skill_version: '1.0.1'
  applies_to: '优化任意已有 skill（元技能）；不用于从零创建新 skill'
  language: 'zh-CN'
  last_reviewed: '2026-09-14'

# ----------------------------------------------------------------------------
# 一、单轮迭代流程（对应 references/01-workflow-overview.md）
# ----------------------------------------------------------------------------
pipeline:
  steps: ['探查', '约束', '证据', '执行', '验证', '交付']
  # 各步骤建议耗时占比（%）。验证占比接近执行占比是健康信号；
  # 验证占比 < 10% 通常意味着「只跑了主流程」，没有零回归与负向用例。
  time_budget_pct:
    探查: 10
    约束: 5
    证据: 10
    执行: 35
    验证: 30
    交付: 10

  # 三条硬纪律（每轮都必须遵守）
  disciplines:
    - '一轮只聚焦 1-2 个核心问题'
    - '探查必须产出物证：命令 / 日志片段 / 产物路径 / 行号'
    - '审查官不写业务代码（只产出评分卡 / 需求确认单 / 任务书 / 裁定 / 复盘）'

  # 轮次预算：按 skill 类型给经验值（轮）
  round_budget:
    doc_only: [2, 3]            # 纯文档类（模板、规范、清单）
    single_shot: [3, 4]         # 单次执行类（转换、提取、生成一次产物）
    multi_stage: [5, 7]         # 多阶段流水线类（抓取 → 加工 → 输出）
    need_listing: '+1'          # 需要平台上架的，在上述基础上 +1 轮

# ----------------------------------------------------------------------------
# 二、多维度质量评估（对应 references/02-assessment-dimensions.md）
# ----------------------------------------------------------------------------
assessment:
  scale:
    0: '完全没有 / 明显有问题'
    1: '有但不完整 / 需要用户自己想辙'
    2: '基本可用，有小瑕疵'
    3: '做得很好，可作为范例'
  # 判定规则：不做平均分，使用「短板逻辑」—— 任一维度 0 分即必须处理
  aggregation: 'short_board'

  explicit_dimensions:         # 显性维度 7 个（权重为建议关注度，0-1）
    - { id: 1,  name: '功能完整性',     weight: 1.0 }
    - { id: 2,  name: '实现正确性',     weight: 1.0 }
    - { id: 3,  name: '体验质量',       weight: 0.9 }
    - { id: 4,  name: '回归安全',       weight: 1.0 }
    - { id: 5,  name: '工程化',         weight: 0.7 }
    - { id: 6,  name: '性能与成本',     weight: 0.6 }
    - { id: 7,  name: '安全与合规',     weight: 0.8 }

  hidden_dimensions:           # 隐形维度 8 个
    - { id: 8,  name: '认知负荷',         weight: 0.8 }
    - { id: 9,  name: '可观测性',         weight: 1.0 }
    - { id: 10, name: '容错与降级',       weight: 0.9 }
    - { id: 11, name: '用户心智模型',     weight: 0.8 }
    - { id: 12, name: '可组合性',         weight: 0.6 }
    - { id: 13, name: '依赖健康度',       weight: 0.6 }
    - { id: 14, name: '可迁移性',         weight: 0.7 }
    - { id: 15, name: '元数据与可发现性', weight: 0.5 }

  # 每轮必查（4 个）：做了吗 / 做对了吗 / 改坏了吗 / 用户看得见吗
  per_round_required: ['功能完整性', '实现正确性', '回归安全', '可观测性']
  # 每轮建议查（3 个）
  per_round_recommended: ['体验质量', '容错与降级', '用户心智模型']
  # 每 2-3 轮查一次
  periodic_interval_rounds: 2
  periodic: ['工程化', '性能与成本', '依赖健康度']
  # 收尾轮 / 上架轮必查
  final_round_required: ['安全与合规', '可迁移性', '元数据与可发现性', '认知负荷', '可组合性']

  # 优先级三规则
  priority_rules:
    - '「用户会撞上但没说」优先于「用户说了但只影响一次」'
    - '静默类问题（不报错但结果错）优先级最高'
    - '修一个 bug 时顺手检查同源问题的其他实例'

# ----------------------------------------------------------------------------
# 三、六步需求管理法（对应 references/03-requirement-management.md）
# ----------------------------------------------------------------------------
requirement_management:
  steps:
    1: { name: '场景还原',           always: true }
    2: { name: '需求具象化',         always: true }
    3: { name: '最小原型验证',       always: false, condition: '涉及主观体验 / 用户不确定想要什么 / 实现成本高' }
    4: { name: '需求变更分类响应',   always: false, condition: '用户中途提出新想法' }
    5: { name: '验收标准共同定义',   always: true }
    6: { name: '期望管理',           always: true, condition: '开工前花两分钟说清即可' }

  # 第 1 步追问链条（顺序不可乱）
  scene_chain: ['场景', '预期', '现实', '影响', '已尝试']
  scene_rule: '一次只问一个维度；追问三遍（笼统描述 → 具体行为 → 可复现细节）'

  # 第 2 步：不给文字描述，要给真实样例渲染结果
  concretization:
    outputs_required: ['真实输入样例', '用户确认的期望输出（验收基准）']
    offer_alternatives: [2, 3]
    block_downstream_if_missing: true   # 没拿到样例就不要往下走

  # 第 4 步：变更分类
  change_classification:
    decision_question: '如果不做这个变更，当前版本的核心目标是否达成？'
    correct_direction:   # 修正方向 → 立即响应
      when: '达不成'
      action: '立即响应'
      timing: '当前版本改'
    new_requirement:     # 新增需求 → 记录
      when: '达成'
      action: '记录到下一轮'
      timing: '下一版本做（禁止塞进当前轮）'

  # 第 6 步：主动说明三件事
  expectation_management:
    - '什么能做，什么不能做'
    - '哪里有 trade-off'
    - '实现成本和时间（几轮迭代、每轮做什么）'

# ----------------------------------------------------------------------------
# 四、硬判据验收（对应 references/05-acceptance-system.md）
# ----------------------------------------------------------------------------
acceptance:
  principles:
    - '能用数据证明的，不用主观判断'
    - '零回归是底线，不是目标（新功能生效 + 旧功能零回归必须同时证明）'
    - '门禁脚本化，可复跑'

  # 零回归判据强度顺序（从上到下依次降级；能用上面的就不要用下面的）
  regression_criteria_order:
    - { level: 5, form: '与上一版逐字节相同' }
    - { level: 4, form: '与上一版逐项计数相等' }
    - { level: 3, form: '与上一版行为一致（A/B 对照 + 抖动基线）' }
    - { level: 2, form: '关键字段抽查' }
    - { level: 1, form: '「应该没改到」', forbidden: true }

  # 验收标准的文本禁区：出现这些词即判定不合格
  forbidden_criteria_keywords:
    ['优化体验', '更好', '更稳定', '更友好', '性能提升', '基本完成', '差不多了', '大致']

  # 四类必需断言（每组验收都要覆盖）
  required_assertion_types:
    正向: '证明该做的做了'
    负向: '证明不该出现的没出现'
    边界: '证明极端输入下行为正确'
    配对: '一正一反看住同一条逻辑（该报警时必须报警、不该报时不得误报）'

  # 六维验收模板
  dimensions: ['功能验收', '内容完整性', '零回归', '结构合法', '性能基准', '文档配置']

  # 未修项披露格式（禁止写「已知问题，后续优化」）
  disclosure_format: '数值 + 占比 + 位置 + 影响判定'
  disclosure_example: '缺口 0.08%（105 字，位于第 3 章引言段），用户不可感知'

  gate:
    naming: '一功能一脚本'
    cli_params: ['--skill', '--output', '--raw-dir', '--url']
    structured_output: 'json'
    exit_code_ok: 0
    exit_code_fail: 1
    must_be_rerunnable: true
    # 门禁反向自检机制（至少启用 1 种）
    self_check_mechanisms:
      - '配对断言（该报必报 / 不误报）'
      - '负向用例组（失败路径必须真的失败）'
      - '严格模式 vs 授权模式对照'
      - '故意引入错误，确认能被检出'
    # 交付包自洽（推荐作为最后一道门禁）
    package_self_check:
      enabled: true
      steps: ['解压交付包', '比对关键文件哈希（包内 vs 技能目录）', '用 --skill 指向解压目录复跑专项门禁']

  # 阈值（超过即需处理或告警）
  thresholds:
    content_gap_pct_max: 0.01        # 内容缺口上限（%）
    text_gap_per_cell_min: 1.5       # 形式转换类差异的下限（字/格）
    text_gap_per_cell_max: 3.0       # 形式转换类差异的上限（字/格）
    volume_warn_mb: 80               # 产物体积告警阈值（MB）
    regression_unexplained_max: 0    # A/B 差异中「未解释项」上限，必须为 0
    default_config_warning_max: 0    # 默认配置下的告警条数上限，必须为 0

# ----------------------------------------------------------------------------
# 五、迭代终止条件（对应 references/01-workflow-overview.md 第四节）
# ----------------------------------------------------------------------------
termination:
  hard_conditions:                   # 全部满足才算达标
    - '需求确认单里的所有硬判据全绿，且判据没有被放宽'
    - '零回归已用最强判据证明'
    - '所有未修项已量化披露，用户已知悉并接受'
    - '隐形维度无 0 分项'
  soft_conditions:                   # 不阻塞收尾，但要写进披露
    - '复盘记录已填写'
    - '知识库已更新'
    - '三处版本号一致（主文件 frontmatter / 配置注释 / 变更记录）'
  cannot_close_when:
    - '用户还没亲手用过一次真实产物'
    - '出现「报告全绿但产物一眼有问题」的情形（应先补判据）'
    - '存在 1 项失败但成因未查明（未查明原因的不是残余，是未知风险）'

# ----------------------------------------------------------------------------
# 六、知识沉淀（对应 references/06-knowledge-management.md）
# ----------------------------------------------------------------------------
knowledge:
  bases:
    anti_patterns:  'knowledge/anti-patterns.md'   # 什么做法是错的、为什么错、正确做法
    best_practices: 'knowledge/best-practices.md'  # 什么做法是好的、适用场景
    cases:          'knowledge/cases/'             # 每个技能的完整优化过程
    retro:          'knowledge/retro/'             # 每轮复盘记录
  write_triggers:
    - '每轮交付后：填复盘模板 + 新条目入库（必做）'
    - '发现「不报错但结果错」的问题后：立即入库（最高价值）'
    - '开始新 skill 优化前：扫反模式库 + 走一次跨 skill 迁移（必做）'
    - '同一方法在 3 个不同场景下都有效：升为最佳实践并写清边界'
  migration_steps: ['问题模式识别', '解决方案匹配', '适配调整']
  # 效率度量指标（每轮记录）
  metrics: ['平均每轮迭代周期', '问题首次识别率', '回归率', '用户满意度']

# ----------------------------------------------------------------------------
# 七、术语表（统一 6 份 references 与 SKILL.md 的用词）
# ----------------------------------------------------------------------------
glossary:
  三方协作闭环: '用户（需求方）→ AI 审查官 → 执行方 → AI 审查官 → 用户 的循环'
  AI审查官: '本技能扮演的角色：需求翻译 + 质量守门人，不写业务代码'
  执行方: '按任务书改代码/文档、跑门禁、产出交付报告的一方（WorkBuddy 或工程师）'
  硬判据: '可量化、可复跑、失败会被立刻发现、口径写进判据文字的验收标准'
  零回归: '未改动功能与上一版一致；最强形式为逐字节相同'
  抖动基线: '同一版本重跑一次，用于识别并排除天然抖动项（时间戳、遍历顺序）'
  未解释项: 'A/B 差异中无法归因的条目；必须为 0'
  静默丢弃: '不报错、不告警但产物少东西的一类缺陷；本案例中出现频率最高'
  账目自洽恒等式: '前置丢弃 + 处理成功 + 跳过 + 失败 == 发现数；不平即告警'
  配对断言: '一正一反看住同一条逻辑的两个断言（该报警必报 / 不该报不误报）'
  反向自检: '证明门禁能失败的能力（严格模式对照、负向用例、故意引入错误）'
  全绿陷阱: '门禁全绿但用户一眼看出问题 —— 判据覆盖面不足导致的假安全'
  需求确认单: '六步法的产物：真实样例 + 期望输出 + 硬判据 + 变更分类 + 期望对齐'
  收敛: '追加轮次后用户不再提出「修正方向」类反馈的状态'
